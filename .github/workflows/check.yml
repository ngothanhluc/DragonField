name: check

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      # tsc --noEmit + vitest + eslint.
      # Không build web ở đây: build cần Cocos Creator GUI, không chạy headless được.
      - run: bun run check
